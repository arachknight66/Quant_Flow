# deployment/nginx/nginx.conf
# Production Nginx configuration

worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include mime.types;
    default_type application/octet-stream;

    # Security headers
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';" always;
    # PHASE 2.2 FIX: Strict-Transport-Security (HSTS) was previously
    # entirely absent from this config. Without it, even after you wire
    # up the HTTPS server block below, a browser visiting
    # http://yourplatform.com for the very first time (before ever
    # receiving an HSTS header) is still vulnerable to an SSL-stripping
    # man-in-the-middle attack on that first request, because nothing
    # has yet told the browser "always upgrade this origin to HTTPS."
    # Once a browser has seen this header once, it enforces HTTPS for
    # the max-age duration on every subsequent visit, closing that gap
    # for all future requests. includeSubDomains extends the same
    # guarantee to api.yourplatform.com, ws.yourplatform.com, etc.
    # max-age=31536000 = 1 year, the standard recommended minimum for
    # HSTS preload-list eligibility.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_types text/plain application/json application/javascript text/css;

    upstream backend {
        server backend:8000;
        keepalive 32;
    }

    upstream web {
        server web:3000;
        keepalive 16;
    }

    # ─────────────────────────────────────────────────────────────────────
    # PHASE 2.2 FIX: this file previously only had a single `listen 80`
    # server block — HTTP only, no TLS termination anywhere. That means
    # JWT access tokens (sent as `Authorization: Bearer <token>` headers)
    # and the httpOnly refresh-token cookie would travel across the
    # network in plaintext on every request: trivially interceptable by
    # anyone on the same network segment, a malicious Wi-Fi access point,
    # or any intermediate router/proxy. COOKIE_SECURE=True (see
    # backend/api/routers/auth.py) makes this WORSE if deployed naively
    # — over plain HTTP the browser will refuse to send the Secure
    # cookie at all, breaking refresh entirely, which is exactly why
    # that flag must follow settings.DEBUG rather than always being True.
    #
    # The fix below: redirect ALL plain HTTP traffic on port 80 straight
    # to HTTPS on port 443, and add a 443 server block that terminates
    # TLS. Certificate paths point at the standard Let's Encrypt /
    # certbot output location — replace with your actual cert paths, or
    # point this at a load balancer / managed TLS terminator (e.g. an
    # AWS ALB, Cloudflare, Railway's built-in TLS) if you're not managing
    # certificates on this box directly. To obtain certs via certbot:
    #
    #   sudo certbot certonly --nginx -d yourplatform.com -d www.yourplatform.com
    #
    # which will populate the exact paths referenced below.
    # ─────────────────────────────────────────────────────────────────────

    server {
        listen 80;
        server_name _;

        # Redirect everything to HTTPS. The only thing that should ever
        # be served over plain port 80 is this redirect itself — never
        # proxy real traffic (API, WebSocket, app) over it.
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl http2;
        server_name _;

        # Replace with your actual certificate paths (e.g. from certbot,
        # or omit this whole server block if TLS is terminated upstream
        # by a load balancer instead of on this nginx instance directly).
        ssl_certificate     /etc/letsencrypt/live/yourplatform.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/yourplatform.com/privkey.pem;

        # Modern TLS only — disables the legacy protocol versions with
        # known weaknesses (TLS 1.0/1.1, all SSL versions).
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # API routes
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;  # Backtest can take time
        }

        # Auth routes — stricter rate limiting
        location /api/v1/auth/login {
            limit_req zone=auth burst=3 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket upgrade
        location /ws/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;  # Long-lived connections
        }

        # Next.js web app
        location / {
            proxy_pass http://web;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}