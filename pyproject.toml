# pyproject.toml (backend root)
[tool.poetry]
name = "quant-platform-backend"
version = "0.1.0"
description = "AI-powered quantitative finance backend"
authors = ["Daksh Saini <dakshsaini889@gmail.com>"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.111.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
sqlalchemy = {extras = ["asyncio"], version = "^2.0.0"}
asyncpg = "^0.29.0"         # async PostgreSQL driver
alembic = "^1.13.0"         # migrations
redis = {extras = ["hiredis"], version = "^5.0.0"}
pydantic = "^2.7.0"
pydantic-settings = "^2.3.0"
yfinance = "^0.2.38"
pandas = "^2.2.0"
numpy = "^1.26.0"
scikit-learn = "^1.5.0"
xgboost = "^2.0.0"
optuna = "^3.6.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
httpx = "^0.27.0"
structlog = "^24.2.0"       # structured JSON logging
tenacity = "^8.3.0"         # retry logic
python-multipart = "^0.0.9"
aiofiles = "^23.2.1"
# PHASE 2.0 FIX: these were imported by code we already wrote (model_monitor.py,
# xgboost_model.py) but never declared as dependencies, so `poetry install`
# followed by running the app would crash with ModuleNotFoundError the moment
# those code paths executed.
scipy = "^1.13.0"           # used by backend/monitoring/model_monitor.py (KS test)
joblib = "^1.4.0"           # used by ml/models/xgboost_model.py (model persistence)

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.0"
pytest-cov = "^5.0.0"
httpx = "^0.27.0"           # test client
ruff = "^0.4.0"             # linting + formatting
mypy = "^1.10.0"
factory-boy = "^3.3.0"      # test fixtures

# ─────────────────────────────────────────────────────────────────────────────
# OPTIONAL / HEAVY DEPENDENCIES — Phase 6 (advanced ML), install separately
# ─────────────────────────────────────────────────────────────────────────────
# These are intentionally NOT in [tool.poetry.dependencies] above. They're
# large (torch alone is 700MB+), not needed until Phase 6, and all three
# modules that use them (garch_model.py, hmm_regime_detector.py, lstm_model.py)
# already have try/except ImportError fallbacks that log a warning and degrade
# gracefully (manual GARCH estimation, k-means regime fallback) rather than
# crashing. Install on demand when you actually start Phase 6 work:
#
#   pip install arch                  # ml/models/volatility/garch_model.py
#   pip install hmmlearn              # ml/models/regime/hmm_regime_detector.py
#   pip install torch                 # ml/models/deep/lstm_model.py
#
# If you want them locked in poetry instead of ad-hoc pip installs, add an
# optional group:
#   [tool.poetry.group.ml-advanced.dependencies]
#   arch = "^7.0.0"
#   hmmlearn = "^0.3.0"
#   torch = "^2.3.0"
# then: poetry install --with ml-advanced

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]